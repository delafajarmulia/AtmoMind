server {
    listen 80;
    
    # Ganti dengan IP lokal atau domain home server Anda
    server_name 192.168.1.100; 

    # Ganti direktori ini dengan lokasi folder 'out' (hasil build Next.js) di server Anda
    # Contoh: /var/www/atmomind/out;
    root /home/rodwell/Documents/Projekku/atmomindweb/AtmoMind/out;
    
    index index.html;

    # Optimasi gzip untuk mempercepat load
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        # Pertama coba cari file yang persis diminta
        # Jika tidak ada, coba tambahkan .html (perilaku Next.js export)
        # Jika tidak ada, fallback ke 404
        try_files $uri $uri.html $uri/ =404;
    }

    # Optimasi cache untuk asset statis (gambar, css, js)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Security headers dasar
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
}
